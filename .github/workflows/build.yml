name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pillow numpy
      - run: python make_icons.py && bash build/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Limpador-macOS
          path: |
            dist/Limpador.pkg
            dist/Limpador.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pillow numpy
      - run: python make_icons.py
      - run: pyinstaller --onefile --console --name Limpador --icon icons/icon.ico limpador.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\Limpador.iss'
      - uses: actions/upload-artifact@v4
        with: { name: Limpador-Windows, path: dist/Limpador-Setup.exe }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow numpy
      - run: python make_icons.py && bash build/build_linux.sh && bash build/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Limpador-Linux
          path: |
            dist/limpador_*.deb
            dist/Limpador-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefactos }
      - uses: softprops/action-gh-release@v2
        with: { files: "artefactos/**/*" }
